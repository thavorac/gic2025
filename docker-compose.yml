version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

  api-gateway:
    build: ./api-gateway
    env_file: ./api-gateway/.env
    container_name: api-gateway
    command: npm run start:dev
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      - rabbitmq

  auth-service:
    build: ./auth-service
    env_file: ./auth-service/.env
    container_name: auth-service
    command: npm run start:dev
    ports:
      - "3001:3000"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    depends_on:
      - rabbitmq

  order-worker:
    build: ./order-worker
    env_file: ./order-worker/.env
    container_name: order-worker
    command: npm run start:dev
    ports:
      - "3002:3000"
    volumes:
      - ./order-worker:/app
      - /app/node_modules
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order-worker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
